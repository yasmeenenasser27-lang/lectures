<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141e30" />
    <meta name="description" content="تطبيق جدول المحاضرات - يعمل بدون إنترنت" />
    
    <title>جدول المحاضرات</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="eng.png" />
    <link rel="apple-touch-icon" href="eng.png" />
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
        width: 100%;
      }

      body {
        font-family: "Cairo", sans-serif;
        background: linear-gradient(-45deg, #141e30, #243b55, #4ca1af, #2c3e50);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px;
        padding-top: max(10px, env(safe-area-inset-top));
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }

      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 900px;
        margin-bottom: 20px;
        padding: 15px;
      }

      .header-img {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #00d2ff;
      }

      .header-title {
        flex: 1;
        text-align: center;
      }

      .header-title h1 {
        font-size: 24px;
        margin: 0;
      }

      .admin-badge {
        background: rgba(76, 175, 80, 0.3);
        color: #90ee90;
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 12px;
        display: none;
      }

      .glass-container {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-radius: 20px;
        padding: 30px 20px;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        border: 1px solid rgba(255, 255, 255, 0.1);
        width: 100%;
        max-width: 900px;
        margin-bottom: 30px;
      }

      #adminControls {
        display: none;
      }

      .form-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .form-group input {
        flex: 1;
        min-width: 120px;
        padding: 12px 15px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50px;
        color: #fff;
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition: all 0.3s ease;
      }

      .form-group input::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }

      .form-group input:focus {
        background: rgba(255, 255, 255, 0.2);
        border-color: #00d2ff;
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
      }

      .add-btn {
        padding: 12px 25px;
        background: linear-gradient(45deg, #00d2ff, #3a7bd5);
        color: white;
        border: none;
        border-radius: 50px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: transform 0.3s, box-shadow 0.3s;
        white-space: nowrap;
      }

      .add-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0, 210, 255, 0.4);
      }

      .add-btn:active {
        transform: translateY(-1px);
      }

      .status-message {
        text-align: center;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 10px;
        display: none;
        font-weight: 600;
        font-size: 14px;
      }

      .status-message.success {
        background: rgba(76, 175, 80, 0.3);
        color: #90ee90;
        display: block;
      }

      .status-message.error {
        background: rgba(255, 69, 69, 0.3);
        color: #ff9999;
        display: block;
      }

      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 8px;
      }

      th, td {
        padding: 12px;
        text-align: center;
      }

      th {
        background: rgba(0, 0, 0, 0.2);
        font-size: 16px;
        color: #00d2ff;
        border-radius: 8px;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      tbody tr {
        background: rgba(255, 255, 255, 0.05);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s, background 0.3s;
        animation: slideIn 0.4s ease forwards;
        border-radius: 8px;
      }

      tbody tr:hover {
        background: rgba(255, 255, 255, 0.15);
        transform: scale(1.01);
      }

      .btn-group {
        display: flex;
        gap: 5px;
      }

      .delete-btn, .edit-btn {
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 20px;
        font-family: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.3s, box-shadow 0.3s;
        font-size: 12px;
      }

      .delete-btn {
        background: linear-gradient(45deg, #ff416c, #ff4b2b);
      }

      .delete-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
      }

      .edit-btn {
        background: linear-gradient(45deg, #4da6ff, #357abd);
      }

      .edit-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 5px 15px rgba(77, 166, 255, 0.4);
      }

      .delete-btn:active, .edit-btn:active {
        transform: scale(0.95);
      }

      .secret-btn {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: none;
        border: none;
        font-size: 28px;
        cursor: pointer;
        opacity: 0.2;
        transition: 0.3s;
        z-index: 100;
        padding: 10px;
      }

      .secret-btn:hover {
        opacity: 1;
      }

      .admin-column {
        display: none;
      }

      .empty-message {
        text-align: center;
        color: #999;
        padding: 40px 20px;
        font-size: 16px;
      }

      .offline-badge {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(255, 107, 107, 0.3);
        color: #ff6b6b;
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 12px;
        display: none;
        z-index: 100;
      }

      .offline-badge.show {
        display: block;
      }

      .modal {
        display: none;
        position: fixed;
        z-index: 200;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        animation: fadeIn 0.3s ease;
      }

      .modal.show {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .modal-content {
        background: rgba(20, 30, 48, 0.95);
        backdrop-filter: blur(15px);
        border-radius: 20px;
        padding: 30px;
        max-width: 500px;
        width: 90%;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        border: 1px solid rgba(255, 255, 255, 0.1);
        animation: slideUp 0.3s ease;
      }

      @keyframes slideUp {
        from {
          transform: translateY(50px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .modal h2 {
        margin-bottom: 20px;
        text-align: center;
        color: #00d2ff;
      }

      .modal-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .modal-form input {
        padding: 12px 15px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        color: #fff;
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition: all 0.3s ease;
      }

      .modal-form input::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }

      .modal-form input:focus {
        background: rgba(255, 255, 255, 0.2);
        border-color: #00d2ff;
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
      }

      .modal-buttons {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      .modal-buttons button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: transform 0.3s, box-shadow 0.3s;
      }

      .save-btn {
        background: linear-gradient(45deg, #00d2ff, #3a7bd5);
        color: white;
      }

      .save-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0, 210, 255, 0.4);
      }

      .cancel-btn {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .cancel-btn:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      @media (max-width: 600px) {
        body {
          padding: 5px;
        }

        .glass-container {
          padding: 20px 15px;
          border-radius: 15px;
          margin-bottom: 60px;
        }

        .form-group {
          gap: 8px;
        }

        .form-group input {
          font-size: 13px;
          padding: 10px 12px;
          min-width: 100px;
        }

        .add-btn {
          padding: 10px 20px;
          font-size: 13px;
        }

        table, thead, tbody, th, td, tr {
          display: block;
          width: 100%;
        }

        th {
          display: none;
        }

        tbody tr {
          margin-bottom: 12px;
          border-radius: 8px;
        }

        td {
          text-align: right;
          position: relative;
          padding-right: 40%;
          padding-left: 12px;
          border-radius: 0;
          font-size: 14px;
        }

        td::before {
          content: attr(data-label);
          position: absolute;
          right: 12px;
          width: 35%;
          color: #00d2ff;
          font-weight: 600;
          font-size: 13px;
        }

        td:first-child {
          border-radius: 8px 8px 0 0;
        }

        td:last-child {
          border-radius: 0 0 8px 8px;
        }

        .delete-btn, .edit-btn {
          padding: 5px 10px;
          font-size: 11px;
        }

        .header {
          padding: 10px;
          margin-bottom: 15px;
        }

        .header-img {
          width: 40px;
          height: 40px;
        }

        .header-title h1 {
          font-size: 20px;
        }

        .secret-btn {
          bottom: 15px;
          left: 15px;
          font-size: 24px;
        }

        .modal-content {
          width: 95%;
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="offline-badge" id="offlineBadge">بدون انترنت ✓</div>

    <div class="header">
      <img src="eng.png" alt="مدرس" class="header-img" />
      <div class="header-title">
        <h1>جدول المحاضرات</h1>
        <div id="adminBadge" class="admin-badge">🔐 مسؤول</div>
      </div>
    </div>

    <div class="glass-container">
      <div id="statusMessage" class="status-message"></div>

      <div id="adminControls" class="form-group">
        <input type="text" id="lectureDay" placeholder="اليوم" />
        <input type="text" id="lectureName" placeholder="الصف" />
        <input type="time" id="lectureTime" />
        <input type="text" id="lectureLocation" placeholder="سنتر" />
        <button class="add-btn" onclick="addLecture()">+ إضافة</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>اليوم</th>
            <th>الصف</th>
            <th>الساعة</th>
            <th>سنتر</th>
            <th class="admin-column">إجراء</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
    </div>

    <div id="editModal" class="modal">
      <div class="modal-content">
        <h2>تعديل المحاضرة</h2>
        <div class="modal-form">
          <input type="text" id="editDay" placeholder="اليوم" />
          <input type="text" id="editName" placeholder="الصف" />
          <input type="time" id="editTime" />
          <input type="text" id="editLocation" placeholder="سنتر" />
        </div>
        <div class="modal-buttons">
          <button class="save-btn" onclick="saveEditLecture()">حفظ</button>
          <button class="cancel-btn" onclick="closeEditModal()">إلغاء</button>
        </div>
      </div>
    </div>

    <button class="secret-btn" onclick="adminLogin()">🔐</button>

    <script>
      let isAdmin = false;
      let editingId = null;

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.log('Service Worker registration failed:', err);
        });
      }

      window.addEventListener('online', updateOfflineStatus);
      window.addEventListener('offline', updateOfflineStatus);

      function updateOfflineStatus() {
        const badge = document.getElementById('offlineBadge');
        if (!navigator.onLine) {
          badge.classList.add('show');
        } else {
          badge.classList.remove('show');
        }
      }

      function showStatus(message, type = "success") {
        const statusDiv = document.getElementById("statusMessage");
        statusDiv.textContent = message;
        statusDiv.className = `status-message ${type}`;
        setTimeout(() => {
          statusDiv.style.display = "none";
        }, 3000);
      }

      function convertTo12Hour(time24) {
        if (!time24) return "-";
        const [hours, minutes] = time24.split(':');
        let hours12 = parseInt(hours);
        const period = hours12 >= 12 ? 'مساءً' : 'صباحاً';
        
        if (hours12 > 12) {
          hours12 -= 12;
        } else if (hours12 === 0) {
          hours12 = 12;
        }
        
        return `${hours12}:${minutes} ${period}`;
      }

      function adminLogin() {
        const password = prompt("أدخل كلمة المرور:");
        if (password === "mennayasmine2710") {
          isAdmin = true;
          document.getElementById("adminBadge").style.display = "block";
          document.getElementById("adminControls").style.display = "flex";
          document.querySelectorAll(".admin-column").forEach((el) => {
            el.style.display = "table-cell";
          });
          displayLectures();
          showStatus("✅ تم تسجيل الدخول كمسؤول!", "success");
        } else {
          showStatus("❌ كلمة المرور خاطئة!", "error");
        }
      }

      function getLectures() {
        const data = localStorage.getItem("lectures");
        return data ? JSON.parse(data) : {};
      }

      function saveLectures(lectures) {
        localStorage.setItem("lectures", JSON.stringify(lectures));
      }

      function displayLectures() {
        const tableBody = document.getElementById("tableBody");
        const lectures = getLectures();
        tableBody.innerHTML = "";

        const lectureArray = Object.entries(lectures);

        if (lectureArray.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="5" class="empty-message">لا توجد محاضرات 📋</td></tr>';
          return;
        }

        lectureArray.forEach(([id, data]) => {
          let actionHTML = "";
          if (isAdmin) {
            actionHTML = `<td data-label="إجراء" class="admin-column" style="display: table-cell;">
              <div class="btn-group">
                <button class="edit-btn" onclick="openEditModal('${id}')">تعديل ✏️</button>
                <button class="delete-btn" onclick="deleteLecture('${id}')">حذف 🗑️</button>
              </div>
            </td>`;
          } else {
            actionHTML = `<td class="admin-column"></td>`;
          }

          const timeDisplay = convertTo12Hour(data.time);

          const row = `
            <tr>
              <td data-label="اليوم">${data.day || "-"}</td>
              <td data-label="الصف">${data.name || "-"}</td>
              <td data-label="الساعة">${timeDisplay}</td>
              <td data-label="سنتر">${data.location || "-"}</td>
              ${actionHTML}
            </tr>
          `;
          tableBody.innerHTML += row;
        });
      }

      function addLecture() {
        const name = document.getElementById("lectureName").value.trim();
        const day = document.getElementById("lectureDay").value.trim();
        const time = document.getElementById("lectureTime").value.trim();
        const location = document.getElementById("lectureLocation").value.trim();

        if (!name || !day || !time || !location) {
          showStatus("⚠️ الرجاء تعبئة جميع الحقول!", "error");
          return;
        }

        const id = Date.now().toString();
        const lectures = getLectures();

        lectures[id] = {
          name: name,
          day: day,
          time: time,
          location: location,
          createdAt: new Date().toISOString()
        };

        saveLectures(lectures);
        showStatus("✅ تم إضافة المحاضرة!", "success");

        document.getElementById("lectureName").value = "";
        document.getElementById("lectureDay").value = "";
        document.getElementById("lectureTime").value = "";
        document.getElementById("lectureLocation").value = "";

        displayLectures();
      }

      function openEditModal(id) {
        editingId = id;
        const lectures = getLectures();
        const lecture = lectures[id];

        document.getElementById("editDay").value = lecture.day;
        document.getElementById("editName").value = lecture.name;
        document.getElementById("editTime").value = lecture.time;
        document.getElementById("editLocation").value = lecture.location;

        document.getElementById("editModal").classList.add("show");
      }

      function closeEditModal() {
        document.getElementById("editModal").classList.remove("show");
        editingId = null;
      }

      function saveEditLecture() {
        const day = document.getElementById("editDay").value.trim();
        const name = document.getElementById("editName").value.trim();
        const time = document.getElementById("editTime").value.trim();
        const location = document.getElementById("editLocation").value.trim();

        if (!name || !day || !time || !location) {
          showStatus("⚠️ الرجاء تعبئة جميع الحقول!", "error");
          return;
        }

        const lectures = getLectures();
        lectures[editingId] = {
          name: name,
          day: day,
          time: time,
          location: location,
          createdAt: lectures[editingId].createdAt
        };

        saveLectures(lectures);
        showStatus("✅ تم تعديل المحاضرة!", "success");
        closeEditModal();
        displayLectures();
      }

      function deleteLecture(id) {
        if (confirm("هل أنت متأكد؟")) {
          const lectures = getLectures();
          delete lectures[id];
          saveLectures(lectures);
          showStatus("✅ تم الحذف!", "success");
          displayLectures();
        }
      }

      document.getElementById("editModal").addEventListener("click", (e) => {
        if (e.target.id === "editModal") {
          closeEditModal();
        }
      });

      window.addEventListener("load", () => {
        displayLectures();
        updateOfflineStatus();
      });
    </script>
  </body>
</html>
